# Every push to main and every pull request is checked here: the backend's
# tests against a real PostgreSQL, the frontend's lint, types, tests and
# production build, and whether the API types the frontend is checked against
# are still the backend's.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow reads the repository and nothing else.
permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      # A database of its own, empty, as the tests require
      # (tests/database_guard.py). The user it creates may create databases,
      # which the migration test needs.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hopsnop
          POSTGRES_PASSWORD: hopsnop
          POSTGRES_DB: hopsnop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hopsnop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # As in .env.example. The tests default to it themselves (tests/conftest.py); Alembic does not.
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://hopsnop:hopsnop@localhost:5432/hopsnop_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Apply the migrations
        run: alembic upgrade head
      - name: Models and migrations agree
        run: alembic check
      - run: pytest

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    env:
      # Built into the pages; nothing listens there during these checks.
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Type check
        # The route types (LayoutProps and the like) are generated by Next.js.
        run: npx next typegen && npx tsc --noEmit
      - run: npm test
      - run: npm run build

  api-contract:
    name: API types are current
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Regenerate the schema and the types
        env:
          # Building the schema loads the settings but connects to nothing.
          ENVIRONMENT: development
          DATABASE_URL: postgresql+psycopg://unused@localhost/unused
        run: |
          (cd backend && python -m app.openapi > openapi.json)
          (cd frontend && npm run api:types)
      - name: Fail if they differ from what is committed
        run: |
          if ! git diff --exit-code -- backend/openapi.json frontend/lib/api-schema.d.ts; then
            echo "::error::The API changed but its schema or the frontend's types were not regenerated. See the root README, API types."
            exit 1
          fi
